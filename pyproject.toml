[project]
name = "drop-the-number"
version = "0.1.0"
description = "Shared deterministic engine for a browser puzzle and future RL experiments"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drop_the_number"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
