[project]
name = "drop-the-number"
version = "0.1.0"
description = "Shared deterministic engine for a browser puzzle and local RL experiments"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
rl = ["gymnasium>=1.2,<2", "numpy>=2,<3", "stable-baselines3>=2.7,<3", "torch>=2.5,<3"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drop_the_number"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
